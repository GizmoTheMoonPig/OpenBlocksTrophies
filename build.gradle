import groovy.json.JsonOutput
import groovy.json.JsonSlurper

plugins {
	id 'java-library'
	id 'eclipse'
	id 'idea'
	id 'maven-publish'
	id 'net.neoforged.moddev' version '2.0.141'
}

def secrets = new Properties()
def secretsFile = file('secrets.properties')
if (secretsFile.exists()) {
	secretsFile.withInputStream {
		stream -> secrets.load(stream)
	}

	fileTree("secrets").matching {
		include "**/*.properties"
	}.each {
		File file ->
			file.withInputStream {
				stream -> secrets.load(stream)
			}
	}
}

idea {
	module {
		downloadJavadoc = true
		downloadSources = true
	}
}

version = "${project.minecraft_version}-${project.mod_version}." + (hasProperty("CIVersion") ? CIVersion : '0')
group = 'com.gizmo.trophies'
base {
	archivesName = mod_name
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)
tasks.withType(JavaCompile).configureEach {
	options.compilerArgs << "-Xlint:all,-classfile,-processing,-deprecation,-this-escape" << "-Werror"
	options.encoding = 'UTF-8'
}

sourceSets {
	data {
		compileClasspath += main.compileClasspath + main.output

		java {
			srcDirs = ['src/main/java', 'src/data/java']
		}
		resources {
			srcDirs = ['src/main/resources']
		}
	}
}

configurations {
	dataImplementation.extendsFrom implementation
}

neoForge {
	evaluationDependsOnChildren()

	version = project.neo_version
	validateAccessTransformers = true

	addModdingDependenciesTo sourceSets.data


	mods {
		"${project.modid}" {
			it.sourceSet this.sourceSets.main
		}

		"${project.modid}-data" {
			it.sourceSet this.sourceSets.main
			it.sourceSet this.sourceSets.data
		}
	}

	def mainMod = mods."${project.modid}"
	def dataMod = mods."${project.modid}-data"

	runs {
		configureEach {
			logLevel = org.slf4j.event.Level.DEBUG
			loadedMods = [mainMod]
		}

		client {
			client()
			if (secrets.getProperty("uuid")) {
				programArguments.addAll(
					'--username', secrets.getProperty("username"),
					'--uuid', secrets.getProperty("uuid"),
					'--accessToken', "",
					'--xuid', ""
				)
			}
		}

		server {
			server()
			programArgument '--nogui'
		}

		data {
			clientData()
			programArguments.addAll '--mod', modid, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
			sourceSet = this.sourceSets.data
			loadedMods = [dataMod]
		}
	}
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
	maven {
		name 'Jared\'s Maven' // JEI
		url 'https://maven.blamejared.com/'
	}
	maven {
		name 'Shedaniel\'s Maven' //REI
		url "https://maven.shedaniel.me"
	}
	maven {
		name = "TerraformersMC" //EMI
		url = "https://maven.terraformersmc.com/"
	}
	maven {
		name 'Curseforge Maven' // Jade
		url "https://www.cursemaven.com"
		content {
			includeGroup "curse.maven"
		}
	}
	maven {
		url = "https://maven.tamaized.com/releases"
	}
}

dependencies {
	//make sure to only pick one of these when testing (switch others to compileOnly)
	implementation "mezz.jei:jei-${project.minecraft_version}-neoforge:${project.jei_version}"
//	compileOnly "me.shedaniel:RoughlyEnoughItems-neoforge:${project.rei_version}"
//	implementation "dev.emi:emi-neoforge:${project.emi_version}+${project.minecraft_version}"

	implementation "curse.maven:jade-324717:8281956"
//	runtimeOnly "team-twilight:twilightforest:4.6.2582:universal"

	annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

processResources {
	def ver = project.version
	filesMatching("META-INF/neoforge.mods.toml") {
		expand([
			'file': [
				'jarVersion': ver
			]
		])
	}
	exclude ".cache"
	def lazyTree = providers.provider {
		fileTree(dir: getOutputs().getFiles().getAsPath(), includes: ["**/*.json", "**/*.mcmeta"])
	}
	doLast {
		lazyTree.get().each {
			File file -> file.setText(JsonOutput.toJson(new JsonSlurper().parse(file)))
		}
	}
}

tasks.named('jar', Jar).configure {
	manifest {
		attributes([
				"Specification-Title"     : mod_name,
				"Specification-Vendor"    : "GizmoTheMoonPig",
				"Specification-Version"   : "1",
				"Implementation-Title"    : mod_name,
				"Implementation-Version"  : project.jar.archiveVersion,
				"Implementation-Vendor"   : "GizmoTheMoonPig",
				"Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
		])
	}
}

def mavenUser = hasProperty("MAVEN_USER") ? CIMUser : secrets.getProperty("maven_username")
def mavenToken = hasProperty("MAVEN_PASS") ? CIMToken : secrets.getProperty("maven_password")

publishing {
	publications {
		create('mavenJava', MavenPublication) {
			afterEvaluate {
				artifact this.project.sourceJar
				artifact this.project.dataJar
				artifact this.project.dataSourceJar
			}
			groupId 'gizmo'
			artifactId this.project.modid
		}
	}
	repositories {
		maven {
			url "https://maven.tamaized.com/releases"
			credentials {
				username mavenUser
				password mavenToken
			}
		}
	}
}

tasks.register('sourceJar', Jar) {
	dependsOn 'classes'
	from sourceSets.main.allSource
	archiveClassifier = 'sources'
}

tasks.register('dataClassesForPublishing', JavaCompile) {
	dependsOn "dataClasses"
	source = fileTree('src/data/java')
	classpath = sourceSets.named('data').get().compileClasspath
	destinationDirectory = layout.buildDirectory.dir("classes/java/dataForPublishing")
}

tasks.register('dataJar', Jar) {
	dependsOn 'dataClassesForPublishing'
	from layout.buildDirectory.dir("classes/java/dataForPublishing")
	archiveClassifier = 'data'
}

tasks.register('dataSourceJar', Jar) {
	from sourceSets.data.allSource
	archiveClassifier = 'data-sources'
}